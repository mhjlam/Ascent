# Ogre3D Resources Configuration (Debug)

[General]
FileSystem=res
FileSystem=res/fonts
FileSystem=res/textures
FileSystem=res/materials
FileSystem=res/meshes
FileSystem=res/overlays

[OgreInternal]
# vcpkg Ogre internal resources
# IMPORTANT: Debug builds must ALSO include the release share path because vcpkg's
# debug package is missing critical GLSL shader files needed for RTSS
FileSystem=$(VCPKG_ROOT)/packages/ogre_x64-windows/share/ogre/Media/Main
FileSystem=$(VCPKG_ROOT)/packages/ogre_x64-windows/share/ogre/Media/Terrain
FileSystem=$(VCPKG_ROOT)/packages/ogre_x64-windows/share/ogre/Media/RTShaderLib
